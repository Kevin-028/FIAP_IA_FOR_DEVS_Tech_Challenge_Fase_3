<div class="card fiap-card mb-4">
  <div class="card-header fiap-card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">🏥 Identificação do Paciente <span class="badge bg-secondary ms-2" style="font-size:0.7rem;font-weight:400">opcional</span></h5>
  </div>
  <div class="card-body">
    <div class="row g-3">
      <div class="col-12 col-md-5">
        <label class="form-label fw-semibold small" for="paciente_nome">Nome</label>
        <input type="text" class="form-control fiap-input" id="paciente_nome" name="paciente_nome" placeholder="Nome completo do paciente" />
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label fw-semibold small" for="paciente_prontuario">Nº Prontuário</label>
        <input type="text" class="form-control fiap-input" id="paciente_prontuario" name="paciente_prontuario" placeholder="000000" />
      </div>
      <div class="col-6 col-md-4">
        <label class="form-label fw-semibold small" for="paciente_data">Data do Exame</label>
        <input type="date" class="form-control fiap-input" id="paciente_data" name="paciente_data" />
      </div>
    </div>
  </div>
</div>

{% for group_key, group in groups.items() %}
<div class="card fiap-card mb-4">
  <div class="card-header fiap-card-header">
    <h5 class="mb-0">{{ group.icon }} {{ group.title }}</h5>
    <p class="mb-0 mt-1 text-white opacity-75 small">{{ group.subtitle }}</p>
  </div>
  <div class="card-body">
    <div class="row g-3">
      {% for feat in group.features %}
      <div class="col-12 col-sm-6 col-lg-4">
        <label for="{{ feat.name }}" class="form-label fw-semibold small d-flex align-items-center gap-1">
          {{ feat.label }}
          <span class="fiap-tooltip-icon" data-bs-toggle="tooltip" data-bs-placement="top" title="{{ feat.tooltip }}">ⓘ</span>
        </label>
        <input type="number" class="form-control fiap-input" id="{{ feat.name }}" name="{{ feat.name }}"
               step="{{ feat.step }}" min="{{ feat.min }}" max="{{ feat.max }}"
               placeholder="{{ feat.placeholder }}" required />
        <div class="form-text fiap-range-hint">Faixa típica: {{ feat.min }} – {{ feat.max }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endfor %}

<div class="card fiap-card mb-4">
  <div class="card-body">
    <div class="d-flex flex-wrap gap-2">
      <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-sample-benign">📋 Exemplo benigno</button>
      <button type="button" class="btn btn-outline-warning btn-sm" id="btn-sample-malign">⚠️ Exemplo maligno</button>
      <button type="button" class="btn btn-outline-danger btn-sm" id="btn-clear">🗑 Limpar</button>
    </div>
  </div>
</div>
