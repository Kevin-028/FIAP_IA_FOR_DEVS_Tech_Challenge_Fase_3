<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}FIAP — Assistente clínico{% endblock %}</title>

  <script>
    (function () {
      try {
        var raw = localStorage.getItem("fiap_settings_v1");
        var s = raw ? JSON.parse(raw) : {};
        var pref = s.theme || "system";
        var resolved = pref;
        if (pref === "system") {
          resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", resolved === "dark" ? "dark" : "light");
        document.documentElement.setAttribute("data-theme-pref", pref);
        document.documentElement.style.colorScheme = resolved === "dark" ? "dark" : "light";
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}" />
</head>
<body class="fiap-app {% block body_class %}{% endblock %}">

  <div class="fiap-shell">
    {% include "partials/sidebar.html" %}

    <div class="fiap-workspace">
      <header class="fiap-topbar">
        <button type="button" class="fiap-sidebar-toggle" id="fiapSidebarToggle"
                aria-controls="fiapSidebar" aria-expanded="true" aria-label="Minimizar menu">
          <span></span><span></span><span></span>
        </button>
        <div class="fiap-topbar-title">
          <span class="fiap-topbar-kicker">Assistente clínico</span>
          <strong>{% block page_heading %}Hospital{% endblock %}</strong>
        </div>
        <div class="fiap-topbar-actions">
          <a href="/assistente" class="btn btn-sm fiap-btn-primary fiap-topbar-cta">Perguntar</a>
          <a href="/configuracoes/" class="fiap-topbar-link {{ 'active' if nav_settings }}" title="Configurações">⚙</a>
        </div>
      </header>

      <main class="fiap-main">
        {% block content %}{% endblock %}
      </main>

      <footer class="fiap-footer">
        <span>FIAP · Tech Challenge Fase 3 · Uso educacional — não substitui avaliação médica</span>
      </footer>
    </div>
  </div>

  <div class="fiap-sidebar-backdrop" id="fiapSidebarBackdrop" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
  <script>
    (function () {
      var KEY = "fiap_sidebar_collapsed";
      var shell = document.querySelector(".fiap-shell");
      var btnMobile = document.getElementById("fiapSidebarToggle");
      var btnCollapse = document.getElementById("fiapSidebarCollapse");
      var backdrop = document.getElementById("fiapSidebarBackdrop");
      if (!shell) return;

      function isDesktop() {
        return window.matchMedia("(min-width: 992px)").matches;
      }

      function syncToggleLabels(collapsed, mobileOpen) {
        if (!btnMobile) return;
        if (isDesktop()) {
          btnMobile.setAttribute("aria-expanded", collapsed ? "false" : "true");
          btnMobile.setAttribute(
            "aria-label",
            collapsed ? "Expandir menu" : "Minimizar menu"
          );
          btnMobile.setAttribute(
            "title",
            collapsed ? "Expandir menu" : "Minimizar menu"
          );
        } else {
          btnMobile.setAttribute("aria-expanded", mobileOpen ? "true" : "false");
          btnMobile.setAttribute("aria-label", mobileOpen ? "Fechar menu" : "Abrir menu");
          btnMobile.setAttribute("title", mobileOpen ? "Fechar menu" : "Abrir menu");
        }
      }

      function setMobileOpen(open) {
        shell.classList.toggle("sidebar-open", open);
        syncToggleLabels(shell.classList.contains("sidebar-collapsed"), open);
        if (backdrop) backdrop.hidden = !open;
      }

      function setCollapsed(collapsed) {
        shell.classList.toggle("sidebar-collapsed", collapsed);
        if (btnCollapse) {
          btnCollapse.setAttribute("aria-pressed", collapsed ? "true" : "false");
          btnCollapse.setAttribute("title", collapsed ? "Expandir menu" : "Minimizar menu");
          btnCollapse.setAttribute("aria-label", collapsed ? "Expandir menu" : "Minimizar menu");
          btnCollapse.textContent = collapsed ? "»" : "«";
        }
        syncToggleLabels(collapsed, shell.classList.contains("sidebar-open"));
        try { localStorage.setItem(KEY, collapsed ? "1" : "0"); } catch (e) {}
      }

      try {
        if (localStorage.getItem(KEY) === "1") setCollapsed(true);
        else syncToggleLabels(false, false);
      } catch (e) {
        syncToggleLabels(false, false);
      }

      if (btnMobile) {
        btnMobile.addEventListener("click", function () {
          if (isDesktop()) {
            setCollapsed(!shell.classList.contains("sidebar-collapsed"));
          } else {
            setMobileOpen(!shell.classList.contains("sidebar-open"));
          }
        });
      }
      if (btnCollapse) {
        btnCollapse.addEventListener("click", function () {
          setCollapsed(!shell.classList.contains("sidebar-collapsed"));
        });
      }
      if (backdrop) {
        backdrop.addEventListener("click", function () { setMobileOpen(false); });
      }
      window.addEventListener("resize", function () {
        if (isDesktop()) setMobileOpen(false);
        syncToggleLabels(
          shell.classList.contains("sidebar-collapsed"),
          shell.classList.contains("sidebar-open")
        );
      });
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
